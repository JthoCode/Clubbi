<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a new school password | Clubbi</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="app-page">
    {% include "_navbar.html" %}
    <main class="auth-card">
      <a class="brand" href="{{ url_for('index') }}">Clubbi</a>
      <p class="eyebrow">School account recovery</p>
      <h1>Choose a new password.</h1>
      <p class="muted">
        Resetting the password also lets you choose a new school login phrase.
      </p>
      {% if reset_error %}
      <div class="alert alert-danger" role="alert">{{ reset_error }}</div>
      {% endif %}
      <form method="post" class="auth-form">
        <input
          type="hidden"
          name="csrfmiddlewaretoken"
          value="{{ csrf_token }}"
        />
        <label for="password">New password</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          maxlength="128"
          required
          autocomplete="new-password"
        />
        <label for="password_confirmation">Confirm new password</label>
        <input
          id="password_confirmation"
          name="password_confirmation"
          type="password"
          minlength="8"
          maxlength="128"
          required
          autocomplete="new-password"
        />
        <label for="school_phrase">New school login phrase</label>
        <input
          id="school_phrase"
          name="school_phrase"
          type="text"
          minlength="4"
          maxlength="80"
          required
          autocomplete="organization-title"
        />
        <button class="primary-button" type="submit">
          Reset school account
        </button>
      </form>
    </main>
  </body>
</html>
